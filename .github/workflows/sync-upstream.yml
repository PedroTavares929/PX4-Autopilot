name: Sync Fork

on:
  schedule:
    - cron: '0 3 * * *'   # diário, 03:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into main
        env:
          # PAT com scope "workflow": o GITHUB_TOKEN não consegue sincronizar alterações a .github/workflows/
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh api repos/${{ github.repository }}/merge-upstream -f branch=main
